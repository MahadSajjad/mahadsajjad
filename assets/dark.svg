    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#594dcb" stop-opacity=".34"/>
      <stop offset="1" stop-color="#594dcb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#26334a" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath>
    <clipPath id="window"><rect x="728" y="62" width="410" height="316" rx="18"/></clipPath>
