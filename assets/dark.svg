<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Mahad Sajjad — full-stack developer</title>
  <desc id="desc">A profile banner with Mahad Sajjad's name, a short tagline, and a stylized product dashboard.</desc>
  <defs>
